version: 2
updates:
  # AndroidX, Compose, Kotlin and the Android Gradle Plugin depend on each other
  # (e.g. new AndroidX releases need a newer AGP and compileSdk), so they arrive as one PR.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      gradle-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
